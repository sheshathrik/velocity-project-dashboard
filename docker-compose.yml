version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velocity-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: velocity_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velocity_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: velocity-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/velocity_dashboard?schema=public"
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: "http://localhost:3000"
      JWT_ACCESS_SECRET: "velozity_access_super_secret_jwt_key_2026_x89"
      JWT_REFRESH_SECRET: "velozity_refresh_super_secret_jwt_key_2026_q41"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_DAYS: "7"
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: velocity-client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:

